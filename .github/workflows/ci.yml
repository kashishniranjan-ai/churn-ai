# Runs the pytest suite on every push/PR so the README's test claims stay true.
#
# What this covers: the 31-test suite (30 pass + 1 skip on a clean checkout,
# because the DB-backed test skips when data/processed/retail.db is absent) and
# a boot smoke test that exercises the real startup guards.
#
# What it deliberately does NOT gate on yet: the Postman/Newman contract run in
# `api-contract`, which is marked continue-on-error until it has been observed
# green end to end. See docs/API_TESTING.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit + API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # 3.13 matches the python:3.13-slim image in the Dockerfile, which is what
      # this project is actually built and verified on. Do not lower this without
      # confirming scikit-learn 1.8.0 (pinned in requirements.txt) still installs.
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # The served model is a pickle: scikit-learn refuses to load artifacts
      # written by a different minor version, and requirements.txt pins 1.8.0 for
      # exactly that reason. Fail loudly here instead of deep inside a test.
      - name: Verify committed model artifacts load
        run: |
          python - <<'PY'
          import sys, warnings
          from pathlib import Path

          sys.path.insert(0, ".")

          import joblib
          from sklearn.exceptions import InconsistentVersionWarning

          warnings.simplefilter("error", InconsistentVersionWarning)

          model_dir = Path("model")
          pipeline_path = model_dir / "customer_prediction_pipeline.joblib"
          metadata_path = model_dir / "feature_metadata.json"
          metrics_path = model_dir / "training_metrics.json"

          for path in (pipeline_path, metadata_path, metrics_path):
              assert path.exists(), f"missing committed artifact: {path}"
              assert path.stat().st_size > 0, f"empty committed artifact: {path}"

          pipeline = joblib.load(pipeline_path)
          assert hasattr(pipeline, "predict_proba"), "artifact is not a classifier"

          print(f"artifacts OK: pipeline={pipeline_path.stat().st_size / 1024:.1f} KB")
          print(f"  steps: {[name for name, _ in pipeline.steps]}")
          PY

      # Exercises the lifespan startup (feature-order guard, artifact load,
      # threshold freeze) through the same code path production uses.
      - name: Boot the app and check its self-reported health
        run: |
          python - <<'PY'
          import sys

          sys.path.insert(0, ".")

          from fastapi.testclient import TestClient

          from app.main import STATE, app
          from app.schemas import FEATURE_ORDER

          with TestClient(app) as client:
              health = client.get("/health").json()
              assert health["status"] == "healthy", health
              assert health["model_loaded"] is True, health
              assert health["feature_count"] == len(FEATURE_ORDER), health

              metrics = client.get("/metrics").json()
              auc = metrics["test_metrics"]["roc_auc"]
              assert auc > 0.5, f"model no better than chance: {auc}"

              features = client.get("/features").json()
              assert features["feature_order"] == list(FEATURE_ORDER)
              assert features["effect_method"], "missing signed-effect method"

          print(f"health OK: v{health['version']} {health['model_type']} "
                f"threshold={STATE['threshold']} test ROC-AUC={auc}")
          PY

      # `python -m pytest` (not bare `pytest`) so the repo root is on sys.path
      # and `import app` / `import src` resolve from a clean checkout.
      - name: Run test suite
        run: python -m pytest tests/ -v --tb=short

  api-contract:
    name: API contract (Newman)
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 10

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Start API
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 >/tmp/uvicorn.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8000/health >/dev/null; then
              echo "API is up"; exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time"; cat /tmp/uvicorn.log; exit 1

      # Newman is not in requirements.txt (it is a Node tool); npx fetches it on
      # the runner, where Node is preinstalled.
      #
      # continue-on-error is intentional: this collection has never been executed
      # end to end (Node/Newman is unavailable in the authoring environment), so
      # promoting it to a hard gate would risk red checks over harness problems
      # rather than real regressions. Remove this line once it has been observed
      # green, and it becomes the contract gate for the API.
      - name: Run Postman collection
        continue-on-error: true
        run: npx --yes newman@6 run docs/postman_collection.json --env-var base_url=http://127.0.0.1:8000